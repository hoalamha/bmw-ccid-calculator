<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC-ID Bit Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }

        textarea {
            padding: 8px;
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            max-height: 500px;
            overflow-y: auto;
        }

        .result-item {
            margin: 10px 0;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #e9e9e9;
        }

        .byte-string {
            font-family: monospace;
            background-color: #eef;
            padding: 5px;
            display: inline-flex;
            gap: 8px;
        }

        .byte-item {
            padding: 3px 6px;
            border-radius: 3px;
            background-color: #dde;
        }

        .changed-byte {
            background-color: #ffeb3b;
            font-weight: bold;
        }

        .byte-index {
            font-size: 10px;
            color: #666;
            display: block;
            text-align: center;
        }

        .note-short {
            max-width: 250px;
            white-space: normal;
            cursor: pointer;
            position: relative;
        }

        .note-short:hover::after {
            content: attr(data-fulltext);
            position: absolute;
            background: #333;
            color: white;
            padding: 5px;
            border-radius: 4px;
            max-width: 350px;
            z-index: 100;
            white-space: normal;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            font-size: 12px;
        }

        .byte-editor-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .byte-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .byte-cell .byte-index {
            font-size: 10px;
            color: #666;
        }

        .byte-input {
            width: 40px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .byte-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 4px rgba(76, 175, 80, 0.4);
        }

        .byte-input.invalid {
            border-color: red;
            background-color: #ffe6e6;
        }

        .byte-input.modified {
            background-color: #fff9c4;
            border-color: #f0a000;
        }

        .byte-editor-output {
            margin-top: 14px;
            font-family: monospace;
            background: #eef;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-size: 13px;
        }

        .editor-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-blue  { background-color: #2196F3; }
        .btn-blue:hover  { background-color: #1976D2; }
        .btn-orange { background-color: #FF9800; }
        .btn-orange:hover { background-color: #e68900; }
        .btn-red   { background-color: #f44336; }
        .btn-red:hover   { background-color: #d32f2f; }
        .btn-purple { background-color: #9C27B0; }
        .btn-purple:hover { background-color: #7B1FA2; }

        .decode-result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .decode-summary {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
        }

        .decode-table-wrap {
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .decode-table-wrap table {
            margin-top: 0;
        }

        .decode-table-wrap thead th {
            position: sticky;
            top: 0;
            background-color: #e9e9e9;
            z-index: 1;
        }

        tr.row-changed {
            background-color: #fff9e6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CC-ID Bit Calculator</h1>
        <div class="input-group">
            <label for="inputType">Input Type:</label>
            <select id="inputType">
                <option value="dec">Decimal (DEC)</option>
                <option value="hex">Hexadecimal (HEX)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="ccids">Enter CC-IDs (separated by commas or spaces, e.g., 299, 300, 301 or 12B, 12C,
                12D):</label>
            <textarea id="ccids" placeholder="299, 300, 301 (DEC) or 12B, 12C, 12D (HEX)">299</textarea>
        </div>
        <div class="input-group">
            <label>Display Mode:</label>
            <label style="display:inline; margin-right: 15px;">
                <input type="radio" name="displayMode" value="grouped" checked> Grouped View
            </label>
            <label style="display:inline;">
                <input type="radio" name="displayMode" value="unified"> Unified View
            </label>
        </div>
        <button onclick="calculateBitPositions()">Calculate</button>
        <div id="result">
            <p>Enter CC-IDs and click "Calculate" to see the results.</p>
        </div>
    </div>

    <!-- ===== BYTE ARRAY EDITOR ===== -->
    <div class="container" style="margin-top: 24px;">
        <h1>Byte Array Editor</h1>
        <div class="input-group">
            <label for="byteInput">Nhập chuỗi HEX (phân cách bằng dấu phẩy hoặc khoảng trắng):</label>
            <textarea id="byteInput" oninput="loadByteArray()"
>FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF,FF</textarea>
        </div>
        <div class="editor-toolbar">
            <button onclick="loadByteArray()">Load / Reload</button>
            <button class="btn-blue" onclick="copyByteArray()">Copy Result</button>
            <button class="btn-orange" onclick="resetByteArray()">Reset</button>
            <button class="btn-purple" onclick="decodeByteArray()">Decode CC-IDs</button>
        </div>
        <div id="byteEditor"></div>
        <div id="byteOutput" class="byte-editor-output" style="display:none;"></div>
        <div id="byteDecodeResult" style="display:none; margin-top:20px;"></div>
    </div>

    <script>
        // ===== BYTE ARRAY EDITOR =====
        let originalBytes = [];

        function loadByteArray() {
            const input = document.getElementById('byteInput').value.trim();
            const parts = input.split(/[\s,]+/).filter(p => p !== '');
            if (parts.length === 0) {
                document.getElementById('byteEditor').innerHTML = '';
                document.getElementById('byteOutput').style.display = 'none';
                return;
            }
            originalBytes = parts.map(p => {
                const v = parseInt(p, 16);
                return isNaN(v) ? 0xFF : (v & 0xFF);
            });
            renderByteEditor(originalBytes);
        }

        function renderByteEditor(bytes) {
            let html = '<div class="byte-editor-grid">';
            bytes.forEach((b, i) => {
                const hex = b.toString(16).toUpperCase().padStart(2, '0');
                html += `
                    <div class="byte-cell">
                        <span class="byte-index">[${i}]</span>
                        <input class="byte-input" type="text" maxlength="2"
                            value="${hex}" data-original="${hex}" data-index="${i}"
                            oninput="onByteInput(this)"
                            onblur="finalizeByteInput(this)">
                    </div>`;
            });
            html += '</div>';
            document.getElementById('byteEditor').innerHTML = html;
            updateByteOutput();
        }

        function onByteInput(el) {
            el.value = el.value.toUpperCase().replace(/[^0-9A-F]/g, '');
            const valid = /^[0-9A-F]{1,2}$/.test(el.value);
            el.classList.toggle('invalid', !valid);
            const changed = el.value !== el.dataset.original;
            if (valid) el.classList.toggle('modified', changed);
            updateByteOutput();
        }

        function finalizeByteInput(el) {
            const val = el.value.trim();
            if (/^[0-9A-F]{1,2}$/.test(val)) {
                el.value = parseInt(val, 16).toString(16).toUpperCase().padStart(2, '0');
                el.classList.remove('invalid');
                el.classList.toggle('modified', el.value !== el.dataset.original);
            }
            updateByteOutput();
        }

        function updateByteOutput() {
            const inputs = document.querySelectorAll('.byte-input');
            if (inputs.length === 0) return;
            const result = Array.from(inputs).map(inp => {
                const v = parseInt(inp.value, 16);
                return isNaN(v) ? '??' : v.toString(16).toUpperCase().padStart(2, '0');
            }).join(',');
            const outEl = document.getElementById('byteOutput');
            outEl.style.display = 'block';
            outEl.innerHTML = `<strong>Result (${inputs.length} bytes):</strong><br>${result}`;
        }

        function copyByteArray() {
            const inputs = document.querySelectorAll('.byte-input');
            if (inputs.length === 0) { alert('Chưa có dữ liệu. Nhấn Load trước.'); return; }
            const result = Array.from(inputs).map(inp => {
                const v = parseInt(inp.value, 16);
                return isNaN(v) ? 'FF' : v.toString(16).toUpperCase().padStart(2, '0');
            }).join(',');
            navigator.clipboard.writeText(result)
                .then(() => alert('Đã copy vào clipboard!'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = result;
                    document.body.appendChild(ta);
                    ta.select(); document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('Đã copy vào clipboard!');
                });
        }

        function resetByteArray() {
            if (originalBytes.length === 0) return;
            renderByteEditor(originalBytes);
            document.getElementById('byteDecodeResult').style.display = 'none';
        }

        function decodeByteArray() {
            const inputs = document.querySelectorAll('.byte-input');
            if (inputs.length === 0) {
                alert('Chưa có dữ liệu. Nhấn Load trước.');
                return;
            }

            const activeCcids = [];

            inputs.forEach((inp, globalByteIndex) => {
                const byteVal = parseInt(inp.value, 16);
                if (isNaN(byteVal)) return;
                const origVal = parseInt(inp.dataset.original, 16);

                for (let bitPos = 0; bitPos < 8; bitPos++) {
                    const isActive = (byteVal & (1 << bitPos)) === 0;
                    if (!isActive) continue;

                    const groupIndex = Math.floor(globalByteIndex / 8);
                    const byteInGroup = globalByteIndex % 8;
                    const ccid = groupIndex * 64 + byteInGroup * 8 + bitPos;

                    const wasActive = !isNaN(origVal) && (origVal & (1 << bitPos)) === 0;
                    activeCcids.push({ ccid, globalByteIndex, bitPos, byteVal, changed: !wasActive });
                }
            });

            const resultEl = document.getElementById('byteDecodeResult');
            resultEl.style.display = 'block';

            if (activeCcids.length === 0) {
                resultEl.innerHTML = '<p>Không có CC-ID nào được kích hoạt (tất cả bits đều là 1).</p>';
                resultEl.scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const changedCount = activeCcids.filter(x => x.changed).length;
            const totalCount = activeCcids.length;

            let html = `
                <div class="decode-result-header">
                    <h3 style="margin:0;">Decoded CC-IDs</h3>
                </div>
                <div class="decode-summary">
                    Tổng active: <strong>${totalCount}</strong> CC-ID
                    &nbsp;|&nbsp; Thay đổi so với gốc: <strong>${changedCount}</strong>
                    &nbsp;|&nbsp; <span style="background:#fff9e6;padding:2px 6px;border-radius:3px;">nền vàng</span> = byte được sửa
                </div>
                <div class="decode-table-wrap">
                <table>
                    <thead><tr>
                        <th>CC-ID (DEC)</th>
                        <th>CC-ID (HEX)</th>
                        <th>Byte [index]</th>
                        <th>Bit</th>
                        <th>Byte Value</th>
                        <th>Notes</th>
                    </tr></thead>
                    <tbody>`;

            activeCcids.forEach(({ ccid, globalByteIndex, bitPos, byteVal, changed }) => {
                const note = ccidNotes[ccid] || { short: 'No notes available', long: 'No further information available.' };
                const rowClass = changed ? ' class="row-changed"' : '';
                html += `
                    <tr${rowClass}>
                        <td>${ccid}</td>
                        <td>${ccid.toString(16).toUpperCase()}</td>
                        <td>[${globalByteIndex}]</td>
                        <td>${bitPos}</td>
                        <td>${byteVal.toString(16).toUpperCase().padStart(2, '0')}</td>
                        <td class="note-short" data-fulltext="${note.long}">${note.short}</td>
                    </tr>`;
            });

            html += '</tbody></table></div>';
            resultEl.innerHTML = html;
            resultEl.scrollIntoView({ behavior: 'smooth' });
        }

        // Auto-load khi trang sẵn sàng
        window.addEventListener('DOMContentLoaded', () => {
            loadByteArray();
        });

        // ===== CC-ID CALCULATOR =====
        // Biến toàn cục để lưu trữ dữ liệu ghi chú từ file JSON
        let ccidNotes = {};

        // Hàm tải dữ liệu JSON từ file bên ngoài
        async function loadNotesData() {
            try {
                const response = await fetch('ccid-notes.json');
                const data = await response.json();
                // Chuyển đổi mảng JSON thành đối tượng để truy cập nhanh theo ID
                data.forEach(note => {
                    ccidNotes[note.ID] = {
                        short: `${note["Control unit"]}: ${note["Text (short form)"]}`,
                        long: note["Text (long form)"]
                    };
                });
                console.log("Notes data loaded successfully.");
            } catch (error) {
                console.error("Error loading notes data:", error);
                document.getElementById('result').innerHTML = '<p class="error">Error loading notes data. Please check console for details.</p>';
            }
        }

        // Tải dữ liệu khi trang được load
        window.addEventListener('load', function () {
            loadNotesData();
        });

        function calculateBitPositions() {
            const inputType = document.getElementById('inputType').value;
            const inputText = document.getElementById('ccids').value.trim();
            if (!inputText) {
                document.getElementById('result').innerHTML = '<p class="error">Please enter at least one CC-ID.</p>';
                return;
            }

            // Split input by commas or spaces
            const ccidArray = inputText.split(/[\s,]+/).filter(id => id.trim() !== '');
            const validCcids = [];
            const invalidCcids = [];

            // Validate and convert input based on type (DEC or HEX)
            ccidArray.forEach(id => {
                let num;
                if (inputType === 'hex') {
                    num = parseInt(id, 16);
                } else {
                    num = parseInt(id, 10);
                }
                if (isNaN(num) || num < 0) {
                    invalidCcids.push(id);
                } else {
                    validCcids.push(num);
                }
            });

            if (validCcids.length === 0) {
                document.getElementById('result').innerHTML = '<p class="error">No valid CC-IDs entered. Please enter numbers >= 0.</p>';
                return;
            }

            let resultHtml = '<h3>Results</h3>';
            if (invalidCcids.length > 0) {
                resultHtml += `<p class="error">Invalid CC-IDs ignored: ${invalidCcids.join(', ')}</p>`;
            }

            resultHtml += `
                <table>
                    <tr>
                        <th>CC-ID (DEC)</th>
                        <th>CC-ID (HEX)</th>
                        <th>Group</th>
                        <th>Bit in Byte</th>
                        <th>Byte Position</th>
                        <th>Result Value (HEX)</th>
                        <th>Notes (Short)</th>
                    </tr>
            `;

            // Initialize default byte array for each group (8 bytes = 64 bits per group)
            const groupBytes = {};
            const groupChangedPositions = {};

            // Calculate for each valid CC-ID and collect data
            validCcids.forEach(ccid => {
                // Calculate Group (64 bits per group, groups start from 1)
                const bitsPerGroup = 64;
                const groupIndex = Math.floor(ccid / bitsPerGroup);
                const groupNumber = groupIndex + 1;

                // Initialize bytes for this group if not already done (8 bytes = 64 bits)
                if (!groupBytes[groupNumber]) {
                    groupBytes[groupNumber] = [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF];
                    groupChangedPositions[groupNumber] = new Set();
                }

                // Calculate bit position within the group
                const bitInGroup = ccid - (groupIndex * bitsPerGroup);

                // Calculate byte and bit within byte
                const byteInGroup = Math.floor(bitInGroup / 8);
                const bitInByte = bitInGroup - (byteInGroup * 8);

                // Clear the bit at the corresponding position
                const bitValue = Math.pow(2, bitInByte);
                groupBytes[groupNumber][byteInGroup] &= ~bitValue;

                // Track changed byte position for highlighting
                groupChangedPositions[groupNumber].add(byteInGroup);

                // Add row to table
                const resultValue = groupBytes[groupNumber][byteInGroup].toString(16).toUpperCase().padStart(2, '0');
                const note = ccidNotes[ccid] || { short: "No notes available", long: "No further information available." };
                resultHtml += `
                    <tr>
                        <td>${ccid}</td>
                        <td>${ccid.toString(16).toUpperCase()}</td>
                        <td>${groupNumber}</td>
                        <td>${bitInByte}</td>
                        <td>${byteInGroup}</td>
                        <td>${resultValue}</td>
                        <td class="note-short" data-fulltext="${note.long}">${note.short}</td>
                    </tr>
                `;
            });

            resultHtml += '</table>';

            // Determine Display Mode
            const displayMode = document.querySelector('input[name="displayMode"]:checked').value;

            // Display the modified byte string based on selected mode
            resultHtml += '<h3>Modified Byte Strings</h3>';

            if (displayMode === 'grouped') {
                for (const [group, bytes] of Object.entries(groupBytes)) {
                    const changedPositions = groupChangedPositions[group] || new Set();

                    // Tạo chuỗi byte tách rời với index
                    const byteElements = bytes.map((b, index) => {
                        const hexValue = b.toString(16).toUpperCase().padStart(2, '0');
                        const isChanged = changedPositions.has(index);
                        const byteClass = isChanged ? 'byte-item changed-byte' : 'byte-item';
                        return `<span class="${byteClass}"><span class="byte-index">[${index}]</span>${hexValue}</span>`;
                    }).join('');

                    resultHtml += `<p><strong>Group ${group}</strong>: <span class="byte-string">${byteElements}</span></p>`;
                }
            } else {
                // Unified Mode: Combine all groups from 1 to maxGroup
                const groupNumbers = Object.keys(groupBytes).map(Number);
                if (groupNumbers.length > 0) {
                    const maxGroup = Math.max(...groupNumbers);
                    let unifiedElements = '';

                    for (let g = 1; g <= maxGroup; g++) {
                        // Use existing group bytes or default to all FF (8 bytes)
                        const bytes = groupBytes[g] || [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF];
                        const changedPositions = groupChangedPositions[g] || new Set();

                        const groupElements = bytes.map((b, index) => {
                            const hexValue = b.toString(16).toUpperCase().padStart(2, '0');
                            const isChanged = changedPositions.has(index);
                            const byteClass = isChanged ? 'byte-item changed-byte' : 'byte-item';
                            // Global byte index: (g-1)*8 + index
                            const globalIndex = (g - 1) * 8 + index;
                            return `<span class="${byteClass}"><span class="byte-index">[${globalIndex}]</span>${hexValue}</span>`;
                        }).join('');

                        unifiedElements += groupElements; // Just concatenate blocks
                    }
                    resultHtml += `<p><span class="byte-string" style="flex-wrap: wrap;">${unifiedElements}</span></p>`;
                }
            }

            document.getElementById('result').innerHTML = resultHtml;
        }
    </script>
</body>

</html>
